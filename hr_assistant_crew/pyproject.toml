[project]
name = "hr_assistant_crew"
version = "0.1.0"
description = "HR_ASSISTANT_CREW using crewAI"
authors = [{ name = "Your Name", email = "you@example.com" }]
requires-python = ">=3.10,<3.14"
dependencies = [
    "crewai[tools]==1.7.2",
    "langchain-google-genai>=4.1.2",
    "langchain-groq>=1.1.1",
    "litellm>=1.75.3",
]

[project.scripts]
hr_assistant_crew = "hr_assistant_crew.main:run"
run_crew = "hr_assistant_crew.main:run"
train = "hr_assistant_crew.main:train"
replay = "hr_assistant_crew.main:replay"
test = "hr_assistant_crew.main:test"
run_with_trigger = "hr_assistant_crew.main:run_with_trigger"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.crewai]
type = "crew"
